; Confetti overlay settings. Missing or invalid values use the defaults below.

[Confetti]
; Time between falling pieces in milliseconds (20-1000)
RainIntervalMs=50
; Pieces launched from each cracker for each input event (1-200)
PiecesPerCracker=55
; How long cracker illustrations stay visible after input in milliseconds (100-2000)
CrackerVisibleMs=1000
; Cracker design: PaperCone, FoilTube, or PopSpring
CrackerStyle=PopSpring
; Maximum number of live confetti pieces (50-20000)
MaxConfetti=10000
